<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YanaFreeLLM Council</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">🤖 LLM Council</div>
      <div class="subtitle">Ask anything — up to 28 free models answer, and the best one wins.</div>
    </header>

    <main id="thread" class="thread"></main>

    <form id="composer" class="composer">
      <input id="input" type="text" placeholder="Ask something…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
